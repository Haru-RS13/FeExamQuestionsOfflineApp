<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基本情報技術者 過去問アプリ</title>
    <!-- スマホアプリ用マニフェスト（インライン設定） -->
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,{
        %22name%22: %22基本情報 過去問アプリ%22,
        %22short_name%22: %22FE過去問%22,
        %22start_url%22: %22.%22,
        %22display%22: %22standalone%22,
        %22background_color%22: %22%23f8fafc%22,
        %22theme_color%22: %22%232563eb%22,
        %22icons%22: []
    }">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 600px; background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); padding: 24px; height: fit-content; }
        h1 { font-size: 1.25rem; margin-bottom: 16px; text-align: center; color: var(--primary); }
        .screen { display: none; }
        .screen.active { display: block; }
        
        /* 設定画面 */
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 0.95rem; }
        .radio-group { display: flex; gap: 10px; }
        .radio-btn { flex: 1; padding: 10px; text-align: center; border: 2px solid var(--border); border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .radio-btn input { display: none; }
        .radio-btn.selected { border-color: var(--primary); background: #eff6ff; color: var(--primary); }
        
        /* ボタン */
        .btn { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        .btn:hover { background: var(--primary-hover); }
        
        /* 問題画面 */
        .quiz-header { display: flex; justify-content: space-between; font-size: 0.85rem; color: #64748b; margin-bottom: 12px; }
        .question-text { font-size: 1rem; font-weight: bold; margin-bottom: 16px; line-height: 1.5; }
        .choices { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .choice-btn { text-align: left; padding: 12px 16px; border: 2px solid var(--border); border-radius: 8px; background: white; cursor: pointer; font-size: 0.95er; transition: all 0.2s; }
        .choice-btn:hover { border-color: var(--primary); }
        .choice-btn.selected { border-color: var(--primary); background: #eff6ff; }
        
        /* 解説・結果エリア */
        .result-box { margin-top: 16px; padding: 16px; border-radius: 8px; display: none; }
        .result-box.correct { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
        .result-box.incorrect { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
        .explanation { margin-top: 8px; font-size: 0.9rem; line-height: 1.4; color: #334155; }
        
        /* 完了画面 */
        .score-display { text-align: center; font-size: 2rem; font-weight: bold; color: var(--primary); margin: 20px 0; }
        .score-sub { text-align: center; color: #64748b; margin-bottom: 24px; }
    </style>
</head>
<body>

<div class="container">
    <h1>基本情報技術者 過去問演習</h1>

    <!-- 1. 設定画面 -->
    <div id="setup-screen" class="screen active">
        <div class="form-group">
            <label>出題数を選択</label>
            <div class="radio-group" id="count-group">
                <label class="radio-btn"><input type="radio" name="count" value="5" checked>5問</label>
                <label class="radio-btn"><input type="radio" name="count" value="10">10問</label>
                <label class="radio-btn"><input type="radio" name="count" value="15">15問</label>
            </div>
        </div>

        <div class="form-group">
            <label>解説表示の有無</label>
            <div class="radio-group" id="expl-group">
                <label class="radio-btn selected"><input type="radio" name="expl" value="yes" checked>表示する</label>
                <label class="radio-btn"><input type="radio" name="expl" value="no">非表示</label>
            </div>
        </div>

        <button class="btn" onclick="startQuiz()">演習スタート</button>
    </div>

    <!-- 2. 問題画面 -->
    <div id="quiz-screen" class="screen">
        <div class="quiz-header">
            <span id="progress-label">第 1 問 / 5問中</span>
            <span id="score-live">正答数: 0</span>
        </div>
        <div class="question-text" id="question-text">ここに問題文が表示されます。</div>
        <div class="choices" id="choices-container">
            <!-- 選択肢がJSで挿入されます -->
        </div>

        <button class="btn" id="action-btn" onclick="submitAnswer()" style="display:none;">解答する</button>
        
        <div id="result-box" class="result-box">
            <div id="result-title" style="font-weight: bold;"></div>
            <div id="explanation-text" class="explanation"></div>
            <button class="btn" onclick="nextQuestion()" style="margin-top: 12px;">次の問題へ</button>
        </div>
    </div>

    <!-- 3. 結果画面 -->
    <div id="result-screen" class="screen">
        <h2>演習終了！お疲れ様でした</h2>
        <div class="score-display" id="final-score">80%</div>
        <div class="score-sub" id="final-detail">5問中 4問正解</div>
        <button class="btn" onclick="resetToSetup()">設定画面に戻る</button>
    </div>
</div>

<script>
    // サンプル問題データ（ここに過去問データを自由に追加・差し替えできます）
    const allQuestions = [
        {
            q: "ITILファンデーションにおいて、インシデント管理の主たる目的はどれか。",
            choices: [
                "ア. 障害の原因を根本的に究明し、恒久対策を講じること",
                "イ. サービスの中断を可能な限り早く正常な状態に回復させること",
                "ウ. 将来発生するリスクを予測し、事前に対策を計画すること",
                "エ. システムの変更に伴うリスクを評価し、承認を与えること"
            ],
            answer: 1, // 0-indexed (イ)
            explanation: "インシデント管理の主たる目的は、ビジネスへの影響を最小限に抑え、サービスを迅速に復旧させることです（根本原因の究明は「問題管理」の役割です）。"
        },
        {
            q: "TCP/IPネットワークにおいて、IPアドレスからMACアドレスを動的に取得するプロトコルはどれか。",
            choices: [
                "ア. ARP",
                "イ. DHCP",
                "ウ. ICMP",
                "エ. DNS"
            ],
            answer: 0, // 0-indexed (ア)
            explanation: "ARP (Address Resolution Protocol) は、IPアドレスからMACアドレスを対応づけて取得するためのプロトコルです。"
        },
        {
            q: "アジャイル開発手法の一つであるスクラムにおいて、プロダクトの改善に向けてプロセスを振り返るミーティングはどれか。",
            choices: [
                "ア. スプリント計画ミーティング",
                "イ. デイリースクラム",
                "ウ. スプリントレビュー",
                "エ. スプリントレトロスペクティブ"
            ],
            answer: 3, // 0-indexed (エ)
            explanation: "スプリントレトロスペクティブ（スプリント振り返り）は、チームの働き方やプロセスを検証し、改善策を話し合う会議です。"
        },
        {
            q: "公開鍵暗号方式で用いられる説明として、適切なものはどれか。",
            choices: [
                "ア. 暗号化と復号に同一の鍵を使用する。",
                "イ. 暗号化鍵は非公開にし、復号鍵は誰でも自由に使えるように公開する。",
                "ウ. 暗号化鍵は公開し、復号鍵は受信者が厳重に秘密に保持する。",
                "エ. 通信を行う当事者間で、事前に安全な経路で共通の鍵を共有しておく必要がある。"
            ],
            answer: 2, // 0-indexed (ウ)
            explanation: "公開鍵暗号方式では、暗号化鍵を公開し（公開鍵）、復号するための秘密鍵は受信者が厳重に管理します。"
        },
        {
            q: "プロジェクトマネジメントにおける「クリティカルパス」に関する記述として、適切なものはどれか。",
            choices: [
                "ア. プロジェクトの中で最もコストがかかる作業の経路",
                "イ. 最も所要日数が長い、プロジェクト全体の完了遅延に直結する経路",
                "ウ. どの作業を遅らせてもプロジェクト全体に影響を与えない経路",
                "エ. リソースを最も多く投入しなければならない並行作業の経路"
            ],
            answer: 1, // 0-indexed (イ)
            explanation: "クリティカルパスは、プロジェクト日程全体の最長経路であり、この経路上にあるタスクが遅延すると全体の日程が遅れます。"
        },
        // 必要に応じて問題数を追加できます（例として5問以上用意）
        {
            q: "関係データベースの正規化において、第1正規形の要件として適切なものはどれか。",
            choices: [
                "ア. すべての属性の値が原子値（分割不可能な値）であること。",
                "イ. 主キーに完全関数従属していない非主キー属性を排除すること。",
                "ウ. 推移的関数従属を排除すること。",
                "エ. 結合従属以外の多値従属を排除すること。"
            ],
            answer: 0, // 0-indexed (ア)
            explanation: "第1正規形は、表のすべてのセル（属性）がこれ以上分割できない単一の値（原子値）で構成されている状態を指します。"
        },
        {
            q: "表計算ソフトのVLOOKUP関数において、検索の型に「FALSE」または「0」を指定した場合の動作はどれか。",
            choices: [
                "ア. 検索値と完全に一致する値だけを検索し、見つからない場合はエラーを返す。",
                "イ. 検索値未満の最大値を検索する。",
                "ウ. 検索値より大きい最小値を検索する。",
                "エ. あいまい一致で最も類似している行を返す。"
            ],
            answer: 0, // 0-indexed (ア)
            explanation: "検索の型にFALSE（または0）を指定すると完全一致検索になり、一致するデータがない場合は #N/A エラーになります。"
        },
        {
            q: "CPUの性能指標であるMIPSが表すものはどれか。",
            choices: [
                "ア. 1秒間に実行できる浮動小数点演算の回数",
                "イ. 1秒間に実行できる命令の百万回数",
                "ウ. メモリのデータ転送速度の最大値",
                "エ. 消費電力あたりの演算処理効率"
            ],
            answer: 1, // 0-indexed (イ)
            explanation: "MIPS (Million Instructions Per Second) は、1秒間に実行できる命令数を百万単位で表した指標です。"
        },
        {
            q: "情報セキュリティにおける「CIA」の構成要素に含まれないものはどれか。",
            choices: [
                "ア. 機密性 (Confidentiality)",
                "イ. 完全性 (Integrity)",
                "ウ. 可用性 (Availability)",
                "エ. 経済性 (Economy)"
            ],
            answer: 3, // 0-indexed (エ)
            explanation: "情報セキュリティの3大要素（CIA）は、機密性・完全性・可用性であり、経済性は含まれません。"
        },
        {
            q: "デザインパターンにおける「Singletonパターン」の目的はどれか。",
            choices: [
                "ア. オブジェクトの生成処理をサブクラスに委譲すること",
                "イ. クラスのインスタンスが確実に1つしか生成されないようにすること",
                "ウ. 既存のクラスのインターフェースを別のインターフェースに変換すること",
                "エ. 複雑なオブジェクト構造を再帰的に構築すること"
            ],
            answer: 1, // 0-indexed (イ)
            explanation: "Singletonパターンは、アプリケーション全体でそのクラスのインスタンスが唯一であることを保証するデザインパターンです。"
        }
    ];

    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let selectedChoiceIndex = null;
    let config = { count: 5, showExplanation: true };

    // ラジオボタンのデザイン連動
    document.querySelectorAll('.radio-group').forEach(group => {
        group.querySelectorAll('.radio-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                group.querySelectorAll('.radio-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                btn.querySelector('input').checked = true;
            });
        });
    });

    function startQuiz() {
        config.count = parseInt(document.querySelector('input[name="count"]:checked').value);
        config.showExplanation = document.querySelector('input[name="expl"]:checked').value === 'yes';

        // 問題をランダムにシャッフルして指定枚数抽出
        let shuffled = [...allQuestions].sort(() => 0.5 - Math.random());
        currentQuestions = shuffled.slice(0, Math.min(config.count, shuffled.length));

        currentIndex = 0;
        score = 0;

        document.getElementById('setup-screen').classList.remove('active');
        document.getElementById('quiz-screen').classList.add('active');
        loadQuestion();
    }

    function loadQuestion() {
        selectedChoiceIndex = null;
        document.getElementById('action-btn').style.display = 'none';
        document.getElementById('result-box').style.display = 'none';

        const q = currentQuestions[currentIndex];
        document.getElementById('progress-label').innerText = `第 ${currentIndex + 1} 問 / ${currentQuestions.length}問中`;
        document.getElementById('score-live').innerText = `正答数: ${score}`;
        document.getElementById('question-text').innerText = q.q;

        const container = document.getElementById('choices-container');
        container.innerHTML = '';

        q.choices.forEach((choice, index) => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerText = choice;
            btn.onclick = () => selectChoice(index, btn);
            container.appendChild(btn);
        });
    }

    function selectChoice(index, btnElement) {
        document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
        btnElement.classList.add('selected');
        selectedChoiceIndex = index;
        document.getElementById('action-btn').style.display = 'block';
    }

    function submitAnswer() {
        if (selectedChoiceIndex === null) return;

        // 選択肢のボタンを無効化
        document.querySelectorAll('.choice-btn').forEach(b => b.style.pointerEvents = 'none');
        document.getElementById('action-btn').style.display = 'none';

        const q = currentQuestions[currentIndex];
        const isCorrect = (selectedChoiceIndex === q.answer);
        if (isCorrect) score++;

        const resultBox = document.getElementById('result-box');
        const resultTitle = document.getElementById('result-title');
        const explanationText = document.getElementById('explanation-text');

        resultBox.className = 'result-box ' + (isCorrect ? 'correct' : 'incorrect');
        resultTitle.innerText = isCorrect ? '⭕ 正解！' : `❌ 不正解…（正解は ${q.choices[q.answer]}）`;

        if (config.showExplanation) {
            explanationText.innerText = q.explanation;
            explanationText.style.display = 'block';
        } else {
            explanationText.style.display = 'none';
        }

        resultBox.style.display = 'block';
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentQuestions.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-screen').classList.remove('active');
        document.getElementById('result-screen').classList.add('active');

        const percentage = Math.round((score / currentQuestions.length) * 100);
        document.getElementById('final-score').innerText = `${percentage}%`;
        document.getElementById('final-detail').innerText = `${currentQuestions.length}問中 ${score}問正解`;
    }

    function resetToSetup() {
        document.getElementById('result-screen').classList.remove('active');
        document.getElementById('setup-screen').classList.add('active');
    }

    // オフライン対応（Service Workerの登録）
    if ('serviceWorker' in navigator) {
        const swCode = `
            self.addEventListener('install', e => {
                e.waitUntil(caches.open('fe-quiz-v1').then(cache => cache.addAll(['./'])));
            });
            self.addEventListener('fetch', e => {
                e.respondWith(caches.match(e.request).then(response => response || fetch(e.request)));
            });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch(() => {});
    }
</script>

</body>
</html>

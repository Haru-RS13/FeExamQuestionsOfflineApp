<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基本情報技術者 過去問アプリ</title>
    <!-- スマホアプリ用マニフェスト（インライン設定） -->
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,{
        %22name%22: %22基本情報 過去問アプリ%22,
        %22short_name%22: %22FE過去問%22,
        %22start_url%22: %22.%22,
        %22display%22: %22standalone%22,
        %22background_color%22: %22%23f8fafc%22,
        %22theme_color%22: %22%232563eb%22,
        %22icons%22: []
    }">
    
    <!-- 事前にすべての問題ファイルを静的に読み込む（スマホでの読み込みエラーを完全に防止） -->
    <script src="questions_r01_spring.js"></script>
    <script src="questions_r01_autumn.js"></script>
    <script src="questions_r02_spring.js"></script>
    <script src="questions_r02_autumn.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 600px; background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); padding: 24px; height: fit-content; }
        h1 { font-size: 1.25rem; margin-bottom: 16px; text-align: center; color: var(--primary); }
        .screen { display: none; }
        .screen.active { display: block; }
        
        /* 設定画面 */
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 0.95rem; }
        .radio-group { display: flex; gap: 10px; }
        .radio-btn { flex: 1; padding: 10px; text-align: center; border: 2px solid var(--border); border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .radio-btn input { display: none; }
        .radio-btn.selected { border-color: var(--primary); background: #eff6ff; color: var(--primary); }
        
        /* ボタン */
        .btn { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        .btn:hover { background: var(--primary-hover); }
        
        /* 問題画面 */
        .quiz-header { display: flex; justify-content: space-between; font-size: 0.85rem; color: #64748b; margin-bottom: 12px; }
        .question-text { font-size: 1rem; font-weight: bold; margin-bottom: 16px; line-height: 1.5; }
        .choices { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .choice-btn { text-align: left; padding: 12px 16px; border: 2px solid var(--border); border-radius: 8px; background: white; cursor: pointer; font-size: 0.95er; transition: all 0.2s; }
        .choice-btn:hover { border-color: var(--primary); }
        .choice-btn.selected { border-color: var(--primary); background: #eff6ff; }
        
        /* 解説・結果エリア */
        .result-box { margin-top: 16px; padding: 16px; border-radius: 8px; display: none; }
        .result-box.correct { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
        .result-box.incorrect { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
        .explanation { margin-top: 8px; font-size: 0.9rem; line-height: 1.4; color: #334155; }
        
        /* 完了画面 */
        .score-display { text-align: center; font-size: 2rem; font-weight: bold; color: var(--primary); margin: 20px 0; }
        .score-sub { text-align: center; color: #64748b; margin-bottom: 24px; }
        .loaded-source { text-align: center; font-size: 0.85rem; color: #64748b; margin-bottom: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h1>基本情報技術者 過去問演習</h1>

    <!-- 1. 設定画面 -->
    <div id="setup-screen" class="screen active">
        <div class="form-group">
            <label>出題数を選択</label>
            <div class="radio-group" id="count-group">
                <label class="radio-btn"><input type="radio" name="count" value="5" checked>5問</label>
                <label class="radio-btn"><input type="radio" name="count" value="10">10問</label>
                <label class="radio-btn"><input type="radio" name="count" value="15">15問</label>
            </div>
        </div>

        <div class="form-group">
            <label>解説表示の有無</label>
            <div class="radio-group" id="expl-group">
                <label class="radio-btn selected"><input type="radio" name="expl" value="yes" checked>表示する</label>
                <label class="radio-btn"><input type="radio" name="expl" value="no">非表示</label>
            </div>
        </div>

        <button class="btn" onclick="startQuiz()">演習スタート</button>
    </div>

    <!-- 2. 問題画面 -->
    <div id="quiz-screen" class="screen">
        <div class="loaded-source" id="loaded-source-label"></div>
        <div class="quiz-header">
            <span id="progress-label">第 1 問 / 5問中</span>
            <span id="score-live">正答数: 0</span>
        </div>
        <div class="question-text" id="question-text">ここに問題文が表示されます。</div>
        <div class="choices" id="choices-container">
            <!-- 選択肢がJSで挿入されます -->
        </div>

        <button class="btn" id="action-btn" onclick="submitAnswer()" style="display:none;">解答する</button>
        
        <div id="result-box" class="result-box">
            <div id="result-title" style="font-weight: bold;"></div>
            <div id="explanation-text" class="explanation"></div>
            <button class="btn" onclick="nextQuestion()" style="margin-top: 12px;">次の問題へ</button>
        </div>
    </div>

    <!-- 3. 結果画面 -->
    <div id="result-screen" class="screen">
        <h2>演習終了！お疲れ様でした</h2>
        <div class="score-display" id="final-score">80%</div>
        <div class="score-sub" id="final-detail">5問中 4問正解</div>
        <button class="btn" onclick="resetToSetup()">設定画面に戻る</button>
    </div>
</div>
